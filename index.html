":"¿Qué afirmaciones describen correctamente la EEPROM en ESP32?","options":["Tiene 1MB por defecto","Permite almacenar datos que persisten tras un reinicio","Es útil para guardar configuraciones","Solo almacena código"],"originalCorrect":[1,2],"type":"multiple","sources":[{"id":"1dJknqI0a1JCqUuXK935zz0xWGcgIj2yR","location":"Pregunta 19"},{"id":"1Y4aSMk1Siw6WflotTwoGPILdIq-j4yY0","location":"Pregunta 1 · página 1"},{"id":"14AkJCjKRRcehFp-Ly1FrN_jzXWHKu7bb","location":"Pregunta 1 · página 1"}],"kind":"original","id":"o-1d94da65c190","topic":"Memoria y seguridad","explanation":"En ESP32, la API EEPROM emula almacenamiento persistente usando Flash; no implica una EEPROM física dedicada. Se usa para configuraciones y no tiene 1 MB fijo por defecto.","correct":[1,2],"subtopic":"¿Qué afirmaciones describen correctamente la EEPROM en ESP32?","scored":true,"caution":"En ESP32, la API EEPROM emula almacenamiento persistente usando Flash; no implica una EEPROM física dedicada. Se usa para configuraciones y no tiene 1 MB fijo por defecto.","technicalRefs":["https://docs.espressif.com/projects/arduino-esp32/en/latest/api/preferences.html"]},{"text":"¿Cuál es la función principal del regulador de tensión en la ESP32 DevKit V1?","options":["Actuar como conversor ADC","Adaptar el voltaje de entrada a niveles seguros para el microcontrolador","Reemplazar el puerto USB","Proteger la placa de sobrevoltajes","Convertir señales digitales en analógicas"],"originalCorrect":[1,3],"type":"single","sources":[{"id":"1dJknqI0a1JCqUuXK935zz0xWGcgIj2yR","location":"Pregunta 20"},{"id":"1Mct5frisVvpW2ykybsBS2mxbpWWVReOC","location":"Pregunta 10"},{"id":"1Y4aSMk1Siw6WflotTwoGPILdIq-j4yY0","location":"Pregunta 2 · página 1"}],"kind":"original","id":"o-3d13f0f73985","topic":"Electricidad y GPIO","explanation":"El regulador adapta la alimentación a 3,3 V dentro de sus límites. No garantiza protección ante cualquier sobretensión ni protege los GPIO frente a señales de 5 V.","correct":[1],"subtopic": "EN","GPIO3 (RX)","GPIO18 (CLK)","GPIO1 (TX)","GND","GPIO22 (SCL)"],"originalCorrect":[1,3],"type":"multiple","sources":[{"id":"1dJknqI0a1JCqUuXK935zz0xWGcgIj2yR","location":"Pregunta 37"},{"id":"1Mct5frisVvpW2ykybsBS2mxbpWWVReOC","location":"Pregunta 16"}],"kind":"original","id":"o-8fb1490de7f0","topic":"UART y serie","explanation":"GPIO1 TX y GPIO3 RX corresponden al UART0 habitual del ESP32 clásico. Otras UART pueden mapearse a otros pines; no son los únicos posibles.","correct":[1,3],"subtopic":"¿Qué pines de la ESP32 se utilizan para comunicación UART?","scored":true,"caution":"GPIO1 TX y GPIO3 RX corresponden al UART0 habitual del ESP32 clásico. Otras UART pueden mapearse a otros pines; no son los únicos posibles.","technicalRefs":["https://docs.espressif.com/projects/arduino-esp32/en/latest/api/gpio.html"]},{"text":"¿Qué sucede si se conecta un dispositivo de 5V directamente a un pin de entrada de ESP32 (3.3V)?","options":["El programa se ejecuta más rápido","El microcontrolador podría no reconocer el estado correctamente","Puede dañar el pin o la placa","Mejora la velocidad de lectura","Aumenta la duración de la batería"],"originalCorrect":[1,2],"type":"multiple","sources":[{"id":"1dJknqI0a1JCqUuXK935zz0xWGcgIj2yR","location":"Pregunta 38"},{"id":"1Mct5frisVvpW2ykybsBS2mxbpWWVReOC","location":"Pregunta 18"},{"id":"14AkJCjKRRcehFp-Ly1FrN_jzXWHKu7bb","location":"Pregunta 10 · página 4"}],"kind":"original","id":"o-90bd132b9b82","topic":"Electricidad y GPIO","explanation":"Conectar 5 V directamente a una entrada de 3,3 V puede dañar el hardware y producir lecturas inválidas. Adaptá niveles; no confundas el pin de alimentación USB/VIN con un GPIO.","correct":[1,2],"subtopic":"¿Qué sucede si se conecta un dispositivo de 5V directamente a un pin de entrada de ESP32 (3.3V)?","scored":true,"technicalRefs":["https://docs.espressif.com/projects/arduino-esp32/en/latest/api/gpio.html"]},{"text":"¿Qué características definen la comunicación I²C?","options":["Es completamente asíncrona","Permite un maestro y varios esclavos","Cada dispositivo tiene una dirección única","Permite varios maestros simultáneos","Usa líneas SDA y SCL"],"originalCorrect":[1,2,4],"type":"multiple","sources":[{"id":"1dJknqI0a1JCqUuXK935zz0xWGcgIj2yR","location":"Pregunta 39"},{"id":"1Mct5frisVvpW2ykybsBS2mxbpWWVReOC","location":"Pregunta 19"}],"kind":"original","id":"o-ff080cccc7c0","topic":"SPI e I2C","explanation":"I2C utiliza SDA y SCL, direccionamiento y reloj: es síncrono. El protocolo admite múltiples maestros con arbitraje; la configuración concreta del curso usa uno. Las direcciones deben evitar colisiones en un mismo bus.","correct":[1,2,3,4],"subtopic":"¿Qué características definen la comunicación I²C?","scored":true,"discrepancy":"El protocolo I2C sí admite múltiples maestros mediante arbitraje.","technicalRefs":["https://www.nxp.com/docs/en/user-guide/UM10204.pdf"]},{"text":"¿Cuál es la resolución típica del ADC en ESP32 al usar analogRead() sin modificarla?","options":["Valores entre 0 y 4095","16 bits","24 bits","12 bits","8 bits"],"originalCorrect":[0,3],"type":"multiple","sources":[{"id":"1dJknqI0a1JCqUuXK935zz0xWGcgIj2yR","location":"Pregunta 40"},{"id":"1Mct5frisVvpW2ykybsBS2mxbpWWVReOC","location":"Pregunta 23"}],"kind":"original","id":"o-7af2fee75ea3","topic":"ADC, DAC y PWM","explanation":"Con resolución de 12 bits hay 4096 códigos, de 0 a 4095. Cantidad de códigos y valor máximo difieren en una unidad.","correct":[0,3],"subtopic":"¿Cuál es la resolución típica del ADC en ESP32 al usar analogRead() sin modificarla?","scored":true,"technicalRefs":["https://docs.espressif.com/projects/arduino-esp32/en/latest/api/ledc.html"]},{"text":"¿Qué es una protoboard y cuál es su utilidad al usar ESP32?","options":["Permite prototipar circuitos fácilmente","Reemplaza el GPIO","Es una memoria externa","Placa para conexiones rápidas sin soldadura","Es un tipo de microcontrolador"],"originalCorrect":[0,3],"type":"multiple","sources":[{"id":"1dJknqI0a1JCqUuXK935zz0xWGcgIj2yR","location":"Pregunta 41"},{"id":"1Mct5frisVvpW2ykybsBS2mxbpWWVReOC","location":"Pregunta 24"}],"kind":"original","id":"o-2eaf93f85daf","topic":"Entorno y herramientas","explanation":"La protoboard permite armar conexiones de prueba sin soldar. No sustituye el microcontrolador ni sus GPIO.","correct":[0,3],"subtopic":"¿Qué es una protoboard y cuál es su utilidad al usar ESP32?","scored":true,"technicalRefs":["https://docs.espressif.com/projects/arduino-esp32/en/latest/api/gpio.html"]},{"text":"¿Qué afirmaciones sobre setup() y loop() en Arduino/ESP32 son correctas?","options":["loop() se ejecuta una sola vez","loop() es llamado desde el firmware","setup() es opcional","setup() se ejecuta solo una vez al inicio","loop() se repite continuamente mientras la placa esté encendida"],"originalCorrect":[3,4],"type":"multiple","sources":[{"id":"1dJknqI0a1JCqUuXK935zz0xWGcgIj2yR","location":"Pregunta 42"},{"id":"1Mct5frisVvpW2ykybsBS2mxbpWWVReOC","location":"Pregunta 25"}],"kind":"original","id":"o-10456c51ec62","topic":"Programación C++","explanation":"El framework Arduino llama setup() una vez tras cada arranque y luego llama loop() repetidamente. loop() sí es invocada por el código del framework, no es una función especial del lenguaje C++.","correct":[1,3,4],"subtopic":"¿Qué afirmaciones sobre setup() y loop() en Arduino/ESP32 son correctas?","scored":true,"discrepancy":"El framework Arduino es quien invoca loop().","technicalRefs":["https://github.com/espressif/arduino-esp32/blob/master/cores/esp32/main.cpp"]},{"text":"¿Cuál es el propósito del botón ENABLE (EN) en la ESP32?","options":["Controlar el encendido de la placa","Eliminar el bootloader","Activar la memoria EEPROM","Conectar el Wi-Fi","Reiniciar el microcontrolador"],"originalCorrect":[0,4],"type":"multiple","sources":[{"id":"1dJknqI0a1JCqUuXK935zz0xWGcgIj2yR","location":"Pregunta 43"},{"id":"1Mct5frisVvpW2ykybsBS2mxbpWWVReOC","location":"Pregunta 26"}],"kind":"original","id":"o-516f54d98b9 MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 11–12, 16–17, 29 · Adaptación de niveles"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 7–8, 11, 25–26 · Adaptación de niveles"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 12–21, 28–34 · Adaptación de niveles"}]},{"id":"n-b7b72dfe6811","topic":"Electricidad y GPIO","subtopic":"Filtro RC","text":"¿Qué técnica ayuda a atenuar ruido rápido en una señal de entrada?","options":["Filtro RC apropiado","Borrar el bootloader","Subir todos los GPIO a HIGH","Cambiar la dirección MAC"],"correct":[0],"type":"single","kind":"new","scored":true,"explanation":"El filtrado modifica la banda de la señal; no aumenta el voltaje máximo tolerado.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 11–12, 16–17, 29 · Filtro RC"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 7–8, 11, 25–26 · Filtro RC"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 12–21, 28–34 · Filtro RC"}]},{"id":"n-7c483291c88a","topic":"Electricidad y GPIO","subtopic":"Corriente","text":"¿Por qué no se deben sumar cargas suponiendo que cada GPIO puede dar siempre su máximo aislado?","options":["Porque la corriente solo depende del código","Porque todos los GPIO son fuentes ideales","Porque PWM elimina la corriente","Existen límites por pin y límites globales del chip/placa"],"correct":[3],"type":"single","kind":"new","scored":true,"explanation":"Los límites eléctricos deben verificarse en la hoja de datos, no generalizar cifras aisladas del apunte.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 11–12, 16–17, 29 · Corriente"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 7–8, 11, 25–26 · Corriente"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 12–21, 28–34 · Corriente"}]},{"id":"n-e4f6d45a0f25","topic":"Electricidad y GPIO","subtopic":"Final de carrera","text":"¿Qué detecta un final de carrera mecánico?","options":["Una dirección IP","La llegada de un mecanismo a una posición mediante contacto","La humedad por Wi-Fi","La frecuencia CPU"],"correct":[1],"type":"single","kind":"new","scored":true,"explanation":"Puede tener contactos normalmente abiertos o cerrados; no equivale automáticamente a una parada de emergencia segura.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 11–12, 16–17, 29 · Final de carrera"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 7–8, 11, 25–26 · Final de carrera"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 12–21, 28–34 · Final de carrera"}]},{"id":"n-fd4ceb34591c","topic":"Electricidad y GPIO","subtopic":"Contacto NC","text":"¿Qué significa normalmente cerrado en un interruptor?","options":["Está cerrado solo al accionarlo","Es una salida DAC","El contacto está cerrado en reposo","No conduce nunca"],"correct":[2],"type":"single","kind":"new","scored":true,"explanation":"NA/NO abre en reposo; NC cierra en reposo. Debe definirse cuál es el estado de reposo.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 11–12, 16–17, 29 · Contacto NC"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 7–8, 11, 25–26 · Contacto NC"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 12–21, 28–34 · Contacto NC"}]},{"id":"n-77511bcf197f","topic":"ADC, DAC y PWM","subtopic":"Resolución ADC","text":"¿Cuántos códigos distintos representa un ADC de 12 bits?","options":["4095","2075","12","4096"],"correct":[3],"type":"single","kind":"new","scored":true,"explanation":"2^12 = 4096; el mayor código es 4095 porque se cuenta desde cero.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · Resolución ADC"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · Resolución ADC"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · Resolución ADC"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · Resolución ADC"}]},{"id":"n-d18ce1e54ad6","topic":"ADC, DAC y PWM","subtopic":"ADC de 10 bits","text":"Si se configura analogReadResolution(10), ¿cuál es el rango de códigos?","options":["0 a 1024","0 a 4095 siempre","0 a 1023","0 a 255"],"correct":[2],"type":"single","kind":"new","scored":true,"explanation":"Diez bits representan 1024 códigos. Cambiar resolución cambia el rango de retorno.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · ADC de 10 bits"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · ADC de 10 bits"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · ADC de 10 bits"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · ADC de 10 bits"}]},{"id":"n-a53a06338f35","topic":"ADC, DAC y PWM","subtopic":"LSB ideal","text":"Con rango ideal de 3,3 V y 12 bits, ¿cuál es el paso aproximado de cuantización?","options":["3,3 mV","0,806 mV","12 V","806 mV"],"correct":[1],"type":"single","kind":"new","scored":true,"explanation":"3,3 / 4096 V ≈ 0,000806 V. Es un modelo ideal, no una garantía de precisión real.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · LSB ideal"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · LSB ideal"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · LSB ideal"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · LSB ideal"}]},{"id":"n-eac244874e40","topic":"ADC, DAC y PWM","subtopic":"Voltaje ideal","text":"Bajo un modelo lineal ideal de 0–3,3 V, ¿qué tensión aproxima el código 2048 de 12 bits?","options":["1,65 V","0,50 V","2048 V","3,3 V"],"correct":[0],"type":"single","kind":"new","scored":true,"explanation":"2048 × 3,3 / 4095 ≈ 1,65 V. Para el hardware real conviene calibración y rango configurado.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · Voltaje ideal"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · Voltaje ideal"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · Voltaje ideal"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · Voltaje ideal"}]},{"id":"n-3f6bf72a0d82","topic":"ADC, DAC y PWM","subtopic":"División entera","text":"¿Qué problema tiene float v = (analogRead(34)/4095)*3.3; si ambas partes de la división son enteras?","options":["Lee GPIO4095","Siempre da el voltaje exacto","Genera una salida DAC","La división entera pierde la fracción antes de multiplicar"],"correct":[3],"type":"single","kind":"new","scored":true,"explanation":"Usar 4095.0 o convertir a float evita truncar. El modelo lineal sigue siendo aproximado.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · División entera"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · División entera"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · División entera"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · División entera"}]},{"id":"n-ff27f0ed4984","topic":"ADC, DAC y PWM","subtopic":"Resolución y exactitud","text":"¿Más bits de ADC garantizan por sí solos mayor exactitud?","options":["Solo si se usa Serial","No: también influyen ruido, calibración y no linealidad","Sí, incluso con entrada fuera de rango","Sí, siempre"],"correct":[1],"type":"single","kind":"new","scored":true,"explanation":"Resolución describe discretización, no el error total de medición.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · Resolución y exactitud"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · Resolución y exactitud"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · Resolución y exactitud"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · Resolución y exactitud"}]},{"id":"n-83e62feeec4e","topic":"ADC, DAC y PWM","subtopic":"Rango medible","text":"¿El ADC mide siempre todo el rango 0–3,3 V con exactitud por defecto?","options":["No: depende del chip, atenuación y calibración","Sí, por tener 12 bits","Sí, por usar Wi-Fi","No existe atenuación"],"correct":[0],"type":"single","kind":"new","scored":true,"explanation":"No confundir tensión de alimentación, límite eléctrico y rango útil de conversión.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · Rango medible"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · Rango medible"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · Rango medible"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · Rango medible"}]},{"id":"n-98508c8774ef","topic":"ADC, DAC y PWM","subtopic":"DAC resolución","text":"¿Cuántos niveles tienen los DAC de 8 bits del ESP32 clásico?","options":["8","256","4096","65536"],"correct":[1],"type":"single","kind":"new","scored":true,"explanation":"El apunte Esp32_2 contiene una línea que dice 16 bits; para el DAC interno clásico corresponde 8 bits.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · DAC resolución"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · DAC resolución"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · DAC resolución"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · DAC resolución"}]},{"id":"n-770ef23d8c6f","topic":"ADC, DAC y PWM","subtopic":"PWM frente a DAC","text":"¿Qué sale físicamente de un GPIO con PWM al 50 % sin filtro?","options":["Una señal digital de 12 V","Una tensión constante exactamente de 1,65 V","Una señal siempre LOW","Pulsos entre LOW y HIGH"],"correct":[3],"type":"single","kind":"new","scored":true,"explanation":"El valor medio puede ser cercano a la mitad de la amplitud; la forma instantánea sigue siendo pulsada.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · PWM frente a DAC"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · PWM frente a DAC"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · PWM frente a DAC"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · PWM frente a DAC"}]},{"id":"n-ab6a9745781c","topic":"ADC, DAC y PWM","subtopic":"Duty cycle","text":"Si una señal permanece 2 ms en HIGH en un período de 8 ms, ¿cuál es su duty cycle?","options":["4 %","75 %","25 %","250 %"],"correct":[2],"type":"single","kind":"new","scored":true,"explanation":"D = Ton/T = 2/8 = 0,25. No se divide el período por Ton.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · Duty cycle"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · Duty cycle"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · Duty cycle"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · Duty cycle"}]},{"id":"n-7fc4774aba73","topic":"ADC, DAC y PWM","subtopic":"Frecuencia PWM","text":"Un período de 2 ms corresponde a una frecuencia de…","options":["2000 Hz","2 Hz","500 Hz","0,5 Hz"],"correct":[2],"type":"single","kind":"new","scored":true,"explanation":"f = 1/T, con T expresado en segundos: 1/0,002 = 500.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · Frecuencia PWM"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · Frecuencia PWM"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · Frecuencia PWM"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · Frecuencia PWM"}]},{"id":"n-52036a9d2c1a","topic":"ADC, DAC y PWM","subtopic":"Valor medio","text":"Una PWM ideal de 0–3,3 V al 30 % tiene una tensión media de…","options":["9,9 V","3,3 V siempre","1,10 V","0,99 V"],"correct":[3],"type":"single","kind":"new","scored":true,"explanation":"Vmedia = amplitud × duty. No implica que la salida sea una continua filtrada.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · Valor medio"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · Valor medio"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · Valor medio"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · Valor medio"}]},{"id":"n-06f2e60c8ac6","topic":"ADC, DAC y PWM","subtopic":"Ejemplo del apunte","text":"Para una PWM ideal de 0–5 V con promedio de 1 V, ¿qué duty se necesita?","options":["1 %","20 %","50 %","80 %"],"correct":[1],"type":"single","kind":"new","scored":true,"explanation":"1/5 = 0,2. El 80 % corresponde al tiempo en LOW, no en HIGH.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · Ejemplo del apunte"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · Ejemplo del apunte"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · Ejemplo del apunte"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · Ejemplo del apunte"}]},{"id":"n-a201f9e1a87e","topic":"ADC, DAC y PWM","subtopic":"PWM extremos","text":"¿Qué representa 100 % de duty en la PWM ideal?","options":["Un pulso por segundo","Siempre LOW","Frecuencia infinita","Salida siempre en HIGH"],"correct":[3],"type":"single","kind":"new","scored":true,"explanation":"0 % es LOW permanente; al 100 % desaparecen los intervalos bajos.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · PWM extremos"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · PWM extremos"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · PWM extremos"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · PWM extremos"}]},{"id":"n-7f7a428b63a7","topic":"ADC, DAC y PWM","subtopic":"Resolución PWM","text":"Con resolución PWM de 8 bits, ¿cuál es el códig ombinado","text":"¿Qué afirmaciones son correctas para una PWM ideal 0–3,3 V al 25 %?","options":["Permanece en HIGH un cuarto del período","Su valor instantáneo es siempre 0,825 V","Su media es 0,825 V","Es idéntica a una salida DAC continua"],"correct":[2,0],"type":"multiple","kind":"new","scored":true,"explanation":"La media no describe cada instante de la onda. PWM alterna niveles; el DAC sostiene una salida analógica.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 12–16 · Cálculo combinado"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 9–11 · Cálculo combinado"},{"id":"1l0VlGT2GKk1D3wnH6ZwDsVN9LvNGOcOh","location":"Páginas 6–9 · Cálculo combinado"},{"id":"1mK-9GQrba2frIOMNnNiYFcQAHxfxtM26","location":"Páginas 23–27 · Cálculo combinado"}]},{"id":"n-48e109963560","topic":"Sensores y actuadores","subtopic":"Comparar taxonomías","text":"¿Qué asociaciones del apunte son correctas?","options":["HMC5883L: campo magnético","HC-SR04: almacenamiento Flash","DHT22: longitud de un cable","MPU-6050: movimiento e inercia"],"correct":[3,0],"type":"multiple","kind":"new","scored":true,"explanation":"Cada sensor transforma una magnitud física concreta; reconocer el módulo evita confundir funciones.","sources":[{"id":"1OG4QDM98MbPWfgiJDZA06jeeH5pU5jno","location":"Páginas 25–29 · Comparar taxonomías"},{"id":"1gKJEANf_dM5VozkMCgg-LsZI7aPdlWKvmUt9BOjrC54","location":"Páginas 16–17 · Comparar taxonomías"},{"id":"1itqGCd9ZtHwPbHmszwy9Khty0-qlxqJj","location":"Páginas 8–9 · Comparar taxonomías"}]},{"id":"n-f552ba786c10","topic":"MQTT","subtopic":"Selección múltiple MQTT","text":"¿Qué afirmaciones sobre MQTT y JSON son correctas?","options":["Un cliente puede publicar y suscribirse","El broker distribuye según topics","JSON es obligatorio en todo mensaje","Un topic difícil equivale a autenticación"],"correct":[0,1],"type":"multiple","kind":"new","scored":true,"explanation":"MQTT organiza el intercambio, mientras el payload y la po <script>
'use strict';
const BANK=JSON.parse(document.getElementById('question-data').textContent),QUESTIONS=BANK.questions,QMAP=new Map(QUESTIONS.map(q=>[q.id,q])),SMAP=new Map(BANK.sources.map(s=>[s.id,s])),KEY='iot.preguntero.v1';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const topics=[...new Set(QUESTIONS.map(q=>q.topic))].sort((a,b)=>a.localeCompare(b,'es'));
let state,view='home',filters={topic:'',kind:'',source:'',query:''},page=0,storageOK=true;
function fresh(){return {schema:1,bankVersion:BANK.version,stats:{},session:null}}
function warning(text){$('#storage-warning').hidden=false;$('#storage-warning').textContent=text}
function validIndices(a,q){return Array.isArray(a)&&a.every(i=>Number.isInteger(i)&&i>=0&&i<q.options.length)&&new Set(a).size===a.length}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return fresh();const x=JSON.parse(raw);if(x.schema!==1||!x.stats||typeof x.stats!=='object'||Array.isArray(x.stats))throw Error('Formato inválido');const out=fresh();for(const [id,s] of Object.entries(x.stats)){if(!QMAP.has(id))continue;if(!s||!['attempts','correct','wrong','streak','lastSeen','lastWrong'].every(k=>Number.isFinite(s[k])&&s[k]>=0)||typeof s.pending!=='boolean')throw Error('Estadísticas inválidas');out.stats[id]=s}if(x.session){const z=x.session;if(!Array.isArray(z.ids)||!z.ids.length||z.ids.length>QUESTIONS.length||new Set(z.ids).size!==z.ids.length||!z.ids.every(id=>QMAP.has(id)&&QMAP.get(id).scored)||!['normal','weak','all'].includes(z.mode)||!Number.isInteger(z.index)||z.index<0||z.index>=z.ids.length||!z.answers||!z.drafts)throw Error('Sesión inválida');for(const [id,a]of Object.entries(z.answers)){if(!z.ids.includes(id)||!validIndices(a.selected,QMAP.get(id))||typeof a.ok!=='boolean')throw Error('Respuesta inválida');a.ok=exact(a.selected,QMAP.get(id).correct)}for(const [id,a]of Object.entries(z.drafts)){if(!z.ids.includes(id)||!validIndices(a,QMAP.get(id)))throw Error('Borrador inválido')}out.session=z}return out}catch(e){warning('No se pudo recuperar el progreso anterior. Podés practicar; se inició un registro nuevo en esta pestaña.');return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false;warning('El navegador no permite guardar el progreso. Podés seguir practicando mientras mantengas abierta esta pestaña.')}}
function exact(a,b){return a.length===b.length&&a.every(i=>b.includes(i))}
state=load();$('#version').textContent=BANK.version;
function stat(id){return state.stats[id]||{attempts:0,correct:0,wrong:0,streak:0,pending:false,lastSeen:0,lastWrong:0}}
function totals(){const a=Object.values(state.stats);return {seen:a.filter(s=>s.attempts).length,attempts:a.reduce((n,s)=>n+s.attempts,0),correct:a.reduce((n,s)=>n+s.correct,0),pending:a.filter(s=>s.pending).length}}
function filtered(){const search=(view==='bank'?filters.query:'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();return QUESTIONS.filter(q=>(!filters.topic||q.topic===filters.topic)&&(!filters.kind||q.kind===filters.kind)&&(!filters.source||q.sources.some(s=>s.id===filters.source))&&(!search||[q.text,q.topic,q.subtopic,...q.options].join(' ').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase().includes(search)))}
function filterUI(search=false){return `<div class="filters"><div class="field"><label for="topic">Tema</label><select id="topic" data-filter="topic"><option value="">Todos los temas</option>${topics.map(t=>`<option ${filters.topic===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="field"><label for="kind">Origen</label><select id="kind" data-filter="kind"><option value="">Originales y nuevas</option><option value="original" ${filters.kind==='original'?'selected':''}>Parciales y HTML</option><option value="new" ${filters.kind==='new'?'selected':''}>Nuevas de apuntes</option></select></div><div class="field"><label for="source">Fuente</label><select id="source" data-filter="source"><option value="">Todas las fuentes</option>${BANK.sources.map(s=>`<option value="${s.id}" ${filters.source===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>${search?`<div class="field" style="flex-basis:100%"><label for="search">Buscar en preguntas y opciones</label><input type="search" id="search" data-filter="query" value="${esc(filters.query)}" placeholder="Por ejemplo: PWM, callbacks, GPIO…"></div>`:''}</div>`}
function aside(){const t=totals(),pct=Math.round(t.seen/QUESTIONS.filter(q=>q.scored).length*100);return `<aside class="aside"><section><h2>Tu recorrido</h2><div class="statline"><span>Preguntas practicadas</span><strong>${t.seen} / ${QUESTIONS.filter(q=>q.scored).length}</strong></div><div class="thinbar" aria-hidden="true"><span style="width:${pct}%"></span></div><div class="statline"><span>Aciertos en intentos</span><strong>${t.attempts?Math.round(t.correct/t.attempts*100)+' %':'Sin intentos'}</strong></div><div class="statline"><span>Para reforzar</span><strong>${t.pending}</strong></div></section><section><h2>Cómo se corrige</h2><p class="small muted">Elegí tus opciones y comprobá. En selección múltiple deben coincidir todas las correctas, sin agregar otras.</p><p class="small muted">Si una clave tiene errores, vas a ver la referencia original y la explicación técnica. El puntaje usa el criterio técnico indicado.</p></section><section><h2>Material reunido</h2><p class="small muted">${QUESTIONS.length} preguntas: 47 originales o variantes y ${QUESTIONS.length-47} nuevas. Incluye «Copia de Resumen IoT».</p><button data-view="sources" class="full" style="margin-top:14px">Consultar fuentes</button></section></aside>`}
function home(){const list=filtered().filter(q=>q.scored),t=totals(),has=!!state.session,done=has&&state.session.ids.every(id=>state.session.answers[id]);return `<div class="intro"><h1>Entendé el tema.<br>Prepará el parcial.</h1><p class="lead">Preguntas de tus parciales y apuntes, con una explicación después de cada respuesta. Practicá de a diez o volvé sobre lo que cuesta.</p></div><div class="layout"><div><section class="study-start"><h2>Una tanda, diez preguntas</h2><p>Combiná temas o elegí uno. Primero aparecen las preguntas que todavía no practicaste.</p>${filterUI()}<div class="actions"><button class="primary" data-action="start" ${!list.length?'disabled':''}>Empezar tanda</button>${has?`<button data-action="resume">${done?'Revisar última tanda':'Retomar tanda'}</button>`:''}<span class="small muted">${list.length} preguntas evaluables disponibles</span></div></section><section class="secondary-block"><div><h2>Practicá toda tu selección</h2><p>Usá los filtros de arriba y resolvé las ${list.length} preguntas evaluables juntas, sin límite de diez. Podés guardar y retomar.</p></div><button data-action="all" ${!list.length?'disabled':''}>Practicar todas (${list.length})</button></section><section class="secondary-block"><div><h2>Reforzá tus debilidades</h2><p>${t.pending?`${t.pending} preguntas pendientes. Retomalas y consolidá el tema con nuevos ejercicios.`:'Todavía no hay errores pendientes. Empezá con una tanda diagnóstica.'}</p></div><button data-action="weak">${t.pending?'Practicar refuerzo':'Hacer diagnóstico'}</button></section><section class="secondary-block"><div><h2>Todo el banco, a mano</h2><p>Buscá un concepto, compará opciones y consultá la procedencia de cada pregunta.</p></div><button data-view="bank">Explorar banco</button></section></div>${aside()}</div>`}
function shuffle(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.x)}
function choose(pool,mode){
 if(mode==='weak'){
  const pending=pool.filter(q=>stat(q.id).pending).sort((a,b)=>(stat(b.id).wrong-stat(a.id).wrong)||(stat(b.id).lastWrong-stat(a.id).lastWrong));
  const selected=pending.slice(0,10),weakTopics=new Set(pending.map(q=>q.topic));
  const rest=shuffle(pool.filter(q=>!selected.includes(q))).sort((a,b)=>Number(weakTopics.has(b.topic))-Number(weakTopics.has(a.topic))||Number(stat(a.id).attempts>0)-Number(stat(b.id).attempts>0));
  return [...selected,...rest].slice(0,10)
 }
 function balanced(candidates,limit){
  const buckets=new Map();
  for(const q of shuffle(candidates).sort((a,b)=>stat(a.id).lastSeen-stat(b.id).lastSeen)){
   if(!buckets.has(q.topic))buckets.set(q.topic,[]);buckets.get(q.topic).push(q)
  }
  const out=[];
  while(out.length<Math.min(limit,candidates.length)){
   for(const key of shuffle([...buckets.keys()].filter(k=>buckets.get(k).length))){
    out.push(buckets.get(key).shift());if(out.length===limit)break
   }
  }
  return out
 }
 const unseen=balanced(pool.filter(q=>!stat(q.id).attempts),10);
 return [...unseen,...balanced(pool.filter(q=>stat(q.id).attempts>0),10-unseen.length)]
}
function start(mode){let pool=(mode==='weak'?QUESTIONS:filtered()).filter(q=>q.scored);if(!pool.length){view='home';render();return}if(state.session&&!state.session.ids.every(id=>state.session.answers[id])&&!confirm('Hay una tanda sin terminar. ¿Querés reemplazarla? Los intentos ya registrados se conservan.'))return;const selected=mode==='all'?shuffle(pool):choose(pool,mode);const diagnostic=mode==='weak'&&!pool.some(q=>stat(q.id).pending);state.session={id:Date.now()+'-'+Math.random().toString(36).slice(2),mode,diagnostic,ids:selected.map(q=>q.id),index:0,answers:{},drafts:{},finished:false};save();view='quiz';render(true)}
function sourcesUI(q){return `<details class="sources"><summary>Ver procedencia y referencias</summary><ul>${q.sources.map(r=>{const s=SMAP.get(r.id);return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a><br>${esc(r.location)}</li>`}).join('')}${(q.technicalRefs||[]).map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Referencia técnica complementaria</a></li>`).join('')}</ul></details>`}
function explanation(q,selected=null){const original=q.originalCorrect,changed=original&&!exact(q.correct,original);return `${q.discrepancy?`<div class="notice"><h3>${q.scored?'Clave con aclaración':'Consulta sin puntaje'}</h3><p>${esc(q.discrepancy)}</p>${changed?`<p><strong>Clave original:</strong> ${original.map(i=>esc(q.options[i])).join('; ')}.</p><p><strong>Criterio técnico usado:</strong> ${q.correct.map(i=>esc(q.options[i])).join('; ')}.</p>`:''}${selected&&changed?`<p>Tu respuesta ${exact(selected,original)?'coincide':'no coincide'} con la clave original.</p>`:''}</div>`:''}<p class="explanation">${esc(q.explanation)}</p>${sourcesUI(q)}`}
function sessionAside(s){return `<aside class="aside session-aside ${s.ids.length>10?'long-session':''}"><section><h2>Mapa de la tanda</h2><div class="question-nav" aria-label="Navegar preguntas">${s.ids.map((id,i)=>{const a=s.answers[id];return `<button data-jump="${i}" aria-current="${s.index===i}" class="${a?(a.ok?'correct':'incorrect'):''}" aria-label="Pregunta ${i+1}, ${a?(a.ok?'correcta':'incorrecta'):'sin responder'}">${i+1}<span class="mark">${a?(a.ok?'OK':'Error'):'—'}</span></button>`}).join('')}</div><p class="legendtext">Cada número abre una pregunta. Los intentos confirmados no se modifican.</p></section><section class="aside-extra"><h2>Aprender del error</h2><p class="small muted">Una respuesta incorrecta queda pendiente de refuerzo hasta que la resuelvas bien en dos intentos consecutivos.</p></section></aside>`}
function quiz(){const s=state.session;if(!s){view='home';return home()}const q=QMAP.get(s.ids[s.index]),a=s.answers[q.id],draft=s.drafts[q.id]||[],all=s.ids.every(id=>s.answers[id]);return `<div class="session-head"><div><h1>${s.diagnostic?'Tanda diagnóstica':s.mode==='weak'?'Refuerzo de debilidades':s.mode==='all'?'Práctica de selección completa':'Tanda de práctica'}</h1><p class="muted">Pregunta ${s.index+1} de ${s.ids.length} · ${Object.keys(s.answers).length} ${Object.keys(s.answers).length===1?'comprobada':'comprobadas'}</p></div><button data-view="home">Guardar y salir</button></div>${s.ids.length<10?`<p class="notice">Hay ${s.ids.length} ${s.ids.length===1?'pregunta evaluable disponible':'preguntas evaluables disponibles'} para esta tanda.</p>`:''}<div class="layout"><section class="panel" aria-label="Pregunta actual"><div class="qmeta"><span>${esc(q.topic)}</span><span class="tag ${q.kind==='new'?'new':''}">${q.kind==='new'?'Nueva de apuntes':'Original'}</span>${q.discrepancy?'<span class="tag warn">Clave con aclaración</span>':''}</div><form id="answer-form"><fieldset><legend id="question-title">${esc(q.text)}</legend><p class="hint">${q.type==='multiple'?'Seleccioná todas las opciones correctas.':'Seleccioná una sola opción.'}</p>${q.code?`<pre><code>${esc(q.code)}</code></pre>`:''}${q.image?`<img class="diagram" src="${q.image}" alt="${esc(q.imageAlt)}">`:''}<div class="options">${q.options.map((o,i)=>{const chosen=(a?a.selected:draft).includes(i),correct=q.correct.includes(i),cl=a?(correct?'ok':chosen?'wrong':''):'';return `<label class="opt ${cl}"><input type="${q.type==='multiple'?'checkbox':'radio'}" name="option" value="${i}" ${chosen?'checked':''} ${a?'disabled':''}><span class="option-text">${esc(o)}</span>${a&&(correct||chosen)?`<span class="status">${correct?(chosen?'Correcta':'Faltó marcar'):'Incorrecta'}</span>`:''}</label>`}).join('')}</div></fieldset>${a?`<div class="feedback ${a.ok?'':'bad'}" role="status"><h3>${a.ok?'Respuesta correcta':'Revisá esta respuesta'}</h3><p>${a.ok?'Coincidencia exacta. Este intento suma un acierto.':'Este intento queda registrado para refuerzo. Las opciones señaladas muestran qué revisar.'}</p>${explanation(q,a.selected)}</div>`:''}<div class="qfooter"><button type="button" data-action="prev" ${s.index===0?'disabled':''}>Anterior</button>${!a?`<button class="primary" type="submit" id="check" ${draft.length?'':'disabled'}>Comprobar</button>`:''}<button type="button" class="${a?'primary':''}" data-action="${s.index===s.ids.length-1&&all?'finish':'next'}" ${s.index===s.ids.length-1&&!all?'disabled':''}>${s.index===s.ids.length-1&&all?'Ver resultado':'Siguiente'}</button></div></form>${all?'<p class="summarytext"><button data-action="finish">Ver resultado de la tanda</button></p>':''}</section>${sessionAside(s)}</div>`}
function check(){const s=state.session,q=QMAP.get(s.ids[s.index]);if(s.answers[q.id])return;const selected=[...document.querySelectorAll('[name=option]:checked')].map(el=>+el.value);if(!selected.length)return;const ok=exact(selected,q.correct),st={...stat(q.id)};st.attempts++;st.lastSeen=Date.now();if(ok){st.correct++;st.streak++;if(st.pending&&st.streak>=2)st.pending=false}else{st.wrong++;st.streak=0;st.pending=true;st.lastWrong=Date.now()}state.stats[q.id]=st;s.answers[q.id]={selected,ok};s.drafts[q.id]=selected;save();render();$('.feedback').scrollIntoView({block:'nearest',behavior:'auto'});$('#announce').textContent=ok?'Respuesta correcta.':'Respuesta incorrecta. Revisá la explicación.'}
function result(){const s=state.session;if(!s){view='home';return home()}const n=Object.keys(s.answers).length,c=Object.values(s.answers).filter(a=>a.ok).length;return `<div class="intro"><h1>Una tanda más cerca.</h1><p class="lead">Repasá las explicaciones y seguí con los temas que necesitan otra vuelta.</p></div><div class="layout"><section class="panel"><h2>Resultado de tu tanda</h2><p class="result-count">${c} de ${s.ids.length}</p><p class="muted">${n?Math.round(c/s.ids.length*100):0} % de aciertos · ${s.ids.length-c} errores · coincidencia exacta</p><div class="review-list">${s.ids.map((id,i)=>{const q=QMAP.get(id),a=s.answers[id];return `<div class="review-row"><span><strong style="color:${a?.ok?'var(--good)':'var(--bad)'}">${a?.ok?'Correcta':'Para revisar'}</strong><br>${esc(q.text)}</span><button data-jump="${i}">Revisar ${i+1}</button></div>`}).join('')}</div><div class="actions"><button class="primary" data-action="weak">Reforzar errores</button><button data-action="start">Otra tanda</button><button data-view="stats">Ver mi avance</button></div></section>${aside()}</div>`}
function bank(){const list=filtered(),eligible=list.filter(q=>q.scored),pages=Math.max(1,Math.ceil(list.length/20));page=Math.min(page,pages-1);return `<div class="intro"><h1>El banco completo</h1><p class="lead">Originales, variantes y ejercicios nuevos. Abrí una ficha para ver solución, explicación y fuente; consultar no modifica tu avance.</p></div>${filterUI(true)}<div class="actions" style="margin-bottom:18px"><button class="primary" data-action="all" ${eligible.length?'':'disabled'}>Practicar coincidencias (${eligible.length})</button><span class="small muted">Todas las evaluables de estos filtros y búsqueda, en una sola tanda.</span></div><p id="search-count" class="muted" role="status">${list.length} preguntas · ${list.filter(q=>!q.scored).length} de consulta sin puntaje</p><div class="bank-list">${list.slice(page*20,page*20+20).map(q=>`<details class="bank-row"><summary><span class="row-title"><strong>${esc(q.text)}</strong><span>${esc(q.topic)} · ${q.kind==='new'?'Nueva de apuntes':'Original'}${!q.scored?' · Sin puntaje':q.discrepancy?' · Clave con aclaración':''}</span></span></summary><div class="bank-content">${q.code?`<pre><code>${esc(q.code)}</code></pre>`:''}${q.image?`<img class="diagram" src="${q.image}" alt="${esc(q.imageAlt)}">`:''}<p class="small muted">${q.type==='multiple'?'Selección múltiple':'Selección única'} · ${esc(q.subtopic)}</p><ol class="bank-options" type="a">${q.options.map((o,i)=>`<li class="${q.correct.includes(i)?'correct':''}">${esc(o)} ${q.correct.includes(i)?'— Correcta':''}</li>`).join('')}</ol>${explanation(q)}</div></details>`).join('')||'<div class="empty"><h2>No hay coincidencias</h2><p>Probá otro término o quitá los filtros.</p><button data-action="clear">Limpiar filtros</button></div>'}</div><div class="pager"><button data-action="bankprev" ${page===0?'disabled':''}>Anterior</button><span class="small muted">Página ${page+1} de ${pages}</span><button data-action="banknext" ${page>=pages-1?'disabled':''}>Siguiente</button></div>`}
function stats(){const t=totals();return `<div class="intro"><h1>Tu avance, tema por tema</h1><p class="lead">${t.attempts?'Cada intento cuenta una sola vez. Los errores salen de pendientes después de dos aciertos consecutivos.':'Todavía no respondiste preguntas. Una tanda diagnóstica te ayuda a encontrar por dónde empezar.'}</p></div><div class="panel"><div class="actions"><button class="primary" data-action="weak">${t.pending?'Reforzar '+t.pending+' '+(t.pending===1?'pendiente':'pendientes'):'Hacer diagnóstico'}</button><button data-view="home">Elegir una tanda</button></div><div class="tablewrap"><table><caption>El porcentaje se calcula sobre intentos confirmados; consultar el banco no suma intentos.</caption><thead><tr><th scope="col">Tema</th><th scope="col">Vistas / banco</th><th scope="col">Aciertos</th><th scope="col">Pendientes</th></tr></thead><tbody>${topics.map(topic=>{const qs=QUESTIONS.filter(q=>q.topic===topic&&q.scored),ss=qs.map(q=>stat(q.id)),attempts=ss.reduce((a,s)=>a+s.attempts,0),correct=ss.reduce((a,s)=>a+s.correct,0);return `<tr><th scope="row">${esc(topic)}</th><td>${ss.filter(s=>s.attempts).length} / ${qs.length}</td><td>${attempts?Math.round(correct/attempts*100)+' %':'—'}</td><td>${ss.filter(s=>s.pending).length}</td></tr>`}).join('')}</tbody></table></div><div style="margin-top:32px"><h2>Este navegador</h2><p class="muted small" style="margin:10px 0 18px">El progreso no se comparte entre dispositivos ni modos de navegación. Borrar los datos del sitio elimina este historial.</p><button class="danger" data-action="reset">Borrar mi progreso</button></div></div>`}
function sources(){return `<div class="intro"><h1>De dónde sale cada pregunta</h1><p class="lead">Trece fuentes reunidas: parciales, cuestionarios HTML y apuntes, incluido «Copia de Resumen IoT». Las preguntas nuevas se identifican como tales.</p></div><div class="panel"><h2>Material de referencia</h2><ul class="source-list">${BANK.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a><span>${QUESTIONS.filter(q=>q.sources.some(r=>r.id===s.id)).length} preguntas vinculadas · ${s.mime==='text/html'?'Cuestionario HTML':s.mime.includes('document')?'Documento de apuntes':'PDF'}</span></li>`).join('')}</ul><h2 style="margin-top:28px">Cobertura y criterio</h2><p class="muted" style="margin-top:12px">Se extrajeron 137 apariciones originales, unificadas en 47 preguntas o variantes. Se agregaron 275 ejercicios por conceptos, cálculos, código y trampas. Se conservan las variantes con opciones diferentes.</p><p class="muted">Las cuatro preguntas de redacción ambigua se pueden consultar en el banco y no entran en las tandas. Ocho claves tienen correcciones técnicas explícitas. Las preguntas nuevas usan el contexto de sus apuntes; algunas también plantean consecuencias o diagnósticos derivados.</p><p class="muted">La cobertura corresponde al material reunido, no garantiza anticipar cada pregunta de un examen futuro. El apunte incluye enlaces a prácticos externos cuyos archivos no forman parte de esta carpeta; no se inventaron sus soluciones.</p><div class="notice"><h3>Dos referencias, una explicación</h3><p>Una selección del alumno no se toma como solución. En originales se usa la clave explícita de Moodle o del HTML; donde corresponde, la ficha presenta la diferencia técnica y el criterio que usa el puntaje.</p></div><h2 style="margin-top:28px">Cómo usarlo</h2><p class="muted" style="margin-top:12px">Descargá este HTML para practicar sin conexión. Los enlaces a fuentes requieren acceso a Drive e Internet. En GitHub Pages el progreso se guarda en ese navegador, separado del archivo local.</p></div>`}
function render(focus=false){document.querySelectorAll('nav [data-view]').forEach(b=>{const current=b.dataset.view===view||(b.dataset.view==='home'&&['quiz','result'].includes(view));if(current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#main').innerHTML=({home,quiz,result,bank,stats,sources}[view]||home)();if(focus){$('#main').focus({preventScroll:true});window.scrollTo(0,0)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view){view=b.dataset.view;if(view==='bank')page=0;render(true);return}if(b.dataset.jump!==undefined){state.session.index=+b.dataset.jump;view='quiz';save();render(true);return}const a=b.dataset.action,s=state.session;if(a==='start')start('normal');if(a==='all')start('all');if(a==='weak')start('weak');if(a==='resume'){view='quiz';render(true)}if(a==='next'||a==='prev'){s.index=Math.max(0,Math.min(s.ids.length-1,s.index+(a==='next'?1:-1)));save();render(true)}if(a==='finish'&&s.ids.every(id=>s.answers[id])){s.finished=true;save();view='result';render(true)}if(a==='bankprev'||a==='banknext'){page+=a==='bankprev'?-1:1;render(true)}if(a==='clear'){filters={topic:'',kind:'',source:'',query:''};page=0;render(true)}if(a==='reset'&&confirm('¿Borrar todos tus intentos, pendientes y la tanda guardada de este navegador? Esta acción no se puede deshacer.')){state=fresh();save();render(true);$('#announce').textContent='Se borró el progreso de este navegador.'}});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();check()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')&&e.target.dataset.filter!=='query'){filters[e.target.dataset.filter]=e.target.value;page=0;render()}if(e.target.name==='option'){const s=state.session,id=s.ids[s.index];if(s.answers[id])return;s.drafts[id]=[...document.querySelectorAll('[name=option]:checked')].map(el=>+el.value);$('#check').disabled=!s.drafts[id].length;save()}});
document.addEventListener('input',e=>{if(e.target.dataset.filter==='query'){const p=e.target.selectionStart;filters.query=e.target.value;page=0;render();$('#search').focus();$('#search').setSelectionRange(p,p)}});
render();
</script></body></html>
